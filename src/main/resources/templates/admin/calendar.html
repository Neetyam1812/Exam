        /* Exact color mappings and layout definitions */
        :root {
            --sidebar-width: 270px;
            --font-sans: 'Outfit', 'Roboto', 'Inter', system-ui, sans-serif;

        body {
            font-family: var(--font-sans);

            overflow: hidden;

            color: #3c4043;
        }

        body.dark-theme {
            background-color: #1a1a1a;
            color: #e8eaed;
        }

        /* Prevent Bootstrap button text color overrides inside React calendar */
        #react-calendar-root button:not([class*="text-"]) {
            color: inherit;
        }

        /* Make date and time input picker icons visible in dark mode */
        .dark-theme input[type="date"]::-webkit-calendar-picker-indicator,
        .dark-theme input[type="time"]::-webkit-calendar-picker-indicator,
        .dark input[type="date"]::-webkit-calendar-picker-indicator,
        .dark input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.8;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }
        .dark-theme input[type="date"]::-webkit-calendar-picker-indicator:hover,
        .dark-theme input[type="time"]::-webkit-calendar-picker-indicator:hover,
        .dark input[type="date"]::-webkit-calendar-picker-indicator:hover,
        .dark input[type="time"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }

        /* Spring Boot Global Sidebar styling integration */
        .sidebar {
            width: var(--sidebar-width) !important;
            min-width: var(--sidebar-width) !important;
            max-width: var(--sidebar-width) !important;
            flex-shrink: 0;

        /* Custom scrollbars matching Google Calendar style */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #dadce0;
            border-radius: 4px;
        }
        .dark-theme ::-webkit-scrollbar-thumb {
            background: #5f6368;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #bdc1c6;
        }
        .dark-theme ::-webkit-scrollbar-thumb:hover {

        /* Remove all box shadows globally as requested */
        * {

        }

<!-- React Main Application Code (using Babel standalone for JSX wrapped in CDATA for Thymeleaf parser protection) -->
<script type="text/babel">
/*<![CDATA[*/
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // --- NATIVE DATE HELPERS (no external library requirement) ---
    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const weekdayNamesShort = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

    const dateHelpers = {
        isSameDay(d1, d2) {
            if (!d1 || !d2) return false;
            return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
        },
        isToday(d) {
            return this.isSameDay(d, new Date());
        },
        isSameMonth(d1, d2) {
            if (!d1 || !d2) return false;
            return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth();
        },
        startOfMonth(d) {
            return new Date(d.getFullYear(), d.getMonth(), 1);
        },
        endOfMonth(d) {
            return new Date(d.getFullYear(), d.getMonth() + 1, 0);
        },
        startOfWeek(d) {
            const day = d.getDay();
            return new Date(d.getFullYear(), d.getMonth(), d.getDate() - day);
        },
        endOfWeek(d) {
            const day = d.getDay();
            return new Date(d.getFullYear(), d.getMonth(), d.getDate() + (6 - day));
        },
        addMonths(d, n) {
            return new Date(d.getFullYear(), d.getMonth() + n, 1);
        },
        subMonths(d, n) {
            return new Date(d.getFullYear(), d.getMonth() - n, 1);
        },
        addWeeks(d, n) {
            return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n * 7);
        },
        subWeeks(d, n) {
            return new Date(d.getFullYear(), d.getMonth(), d.getDate() - n * 7);
        },
        addDays(d, n) {
            return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
        },
        subDays(d, n) {
            return new Date(d.getFullYear(), d.getMonth(), d.getDate() - n);
        },
        eachDayOfInterval(start, end) {
            const days = [];
            let current = new Date(start.getFullYear(), start.getMonth(), start.getDate());
            const stop = new Date(end.getFullYear(), end.getMonth(), end.getDate());
            while (current <= stop) {
                days.push(new Date(current));
                current.setDate(current.getDate() + 1);
            }
            return days;
        },
        differenceInMinutes(d1, d2) {
            return Math.round((d1.getTime() - d2.getTime()) / 60000);
        },
        format(date, pattern) {
            if (pattern === 'MMMM yyyy') {
                return `${monthNames[date.getMonth()]} ${date.getFullYear()}`;
            }
            if (pattern === 'MMM') {
                return monthNames[date.getMonth()].substring(0, 3);
            }
            if (pattern === 'd') {
                return `${date.getDate()}`;
            }
            if (pattern === 'EEEE') {
                const longWeekdays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
                return longWeekdays[date.getDay()];
            }
            if (pattern === 'EEEE, MMMM d') {
                return `${this.format(date, 'EEEE')}, ${monthNames[date.getMonth()]} ${date.getDate()}`;
            }
            if (pattern === 'EEE') {
                return weekdayNamesShort[date.getDay()];
            }
            if (pattern === 'HH:mm') {
                return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
            }
            if (pattern === 'hh:mm a') {
                let hours = date.getHours();
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12;
                const minutes = String(date.getMinutes()).padStart(2, '0');
                return `${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;
            }
            return date.toDateString();
        }
    };

    // --- BACKEND ROOM INJECTION & EXTRACTOR UTILITIES ---
    const parseRoomFromDescription = (desc) => {
        if (!desc) return '';
        const match = desc.match(/\[Room:\s*(.*?)\]/);
        return match ? match[1] : '';
    };

    const cleanDescription = (desc) => {
        if (!desc) return '';
        return desc.replace(/\[Room:\s*(.*?)\]/, '').trim();
    };

    const getEventCategory = (e) => {
        if (!e) return 'admin';
        const type = e.eventType?.toLowerCase();
        const catName = e.category?.toLowerCase();
        if (type === 'holiday' || catName === 'holiday' || catName === 'holidays') return 'holidays';
        if (type === 'exam' || catName === 'exams' || catName === 'exam') return 'exams';
        if (catName === 'birthdays' || catName === 'birthday') return 'birthdays';
        if (type === 'task' || catName === 'tasks' || catName === 'task') return 'tasks';
        return 'admin';
    };

    // --- AI CONFLICT AUDITING HELPER ---
    const detectConflicts = (events) => {
        const conflictsMap = {};
        const globalConflicts = [];

        events.forEach(e => {
            conflictsMap[e.id] = [];
        });

        const sortedEvents = [...events].sort(
            (a, b) => new Date(a.start).getTime() - new Date(b.start).getTime()
        );

        for (let i = 0; i < sortedEvents.length; i++) {
            const eventA = sortedEvents[i];
            const startA = new Date(eventA.start);
            const endA = new Date(eventA.end);

            for (let j = i + 1; j < sortedEvents.length; j++) {
                const eventB = sortedEvents[j];
                const startB = new Date(eventB.start);
                const endB = new Date(eventB.end);

                // Check overlap
                const isOverlapping = startA < endB && startB < endA;

                if (isOverlapping) {
                    // Overlap Warning
                    const overlapMsg = `Overlapping events: "${eventA.title}" and "${eventB.title}"`;
                    conflictsMap[eventA.id].push({ type: 'overlap', message: overlapMsg, peerId: eventB.id });
                    conflictsMap[eventB.id].push({ type: 'overlap', message: overlapMsg, peerId: eventA.id });

                    globalConflicts.push({
                        id: `overlap-${eventA.id}-${eventB.id}`,
                        type: 'overlap',
                        description: overlapMsg,
                        eventIds: [eventA.id, eventB.id],
                        date: startA
                    });

                    // Room Double Booking Warning
                    if (
                        eventA.room &&
                        eventB.room &&
                        eventA.room.trim() !== '' &&
                        eventA.room.trim().toLowerCase() === eventB.room.trim().toLowerCase()
                    ) {
                        const roomMsg = `Room "${eventA.room}" double-booked for "${eventA.title}" and "${eventB.title}"`;
                        conflictsMap[eventA.id].push({ type: 'room-booking', message: roomMsg, peerId: eventB.id });
                        conflictsMap[eventB.id].push({ type: 'room-booking', message: roomMsg, peerId: eventA.id });

                        globalConflicts.push({
                            id: `room-${eventA.id}-${eventB.id}`,
                            type: 'room-booking',
                            description: roomMsg,
                            eventIds: [eventA.id, eventB.id],
                            date: startA
                        });
                    }
                } else {
                    // Back-to-back Exam Warning (only if both are Exams)
                    if (
                        eventA.category?.toLowerCase() === 'exams' &&
                        eventB.category?.toLowerCase() === 'exams'
                    ) {
                        const bufferMinutes = Math.abs(dateHelpers.differenceInMinutes(startB, endA));
                        if (bufferMinutes < 30) {
                            const examMsg = `Back-to-back exams ("${eventA.title}" and "${eventB.title}") have less than 30m buffer (${bufferMinutes} mins)`;
                            conflictsMap[eventA.id].push({ type: 'exam-buffer', message: examMsg, peerId: eventB.id });
                            conflictsMap[eventB.id].push({ type: 'exam-buffer', message: examMsg, peerId: eventA.id });

                            globalConflicts.push({
                                id: `exam-${eventA.id}-${eventB.id}`,
                                type: 'exam-buffer',
                                description: examMsg,
                                eventIds: [eventA.id, eventB.id],
                                date: startA
                            });
                        }
                    }
                }
            }
        }

        return { conflictsMap, globalConflicts };
    };

    // --- COMPONENT: TOPBAR ---
    function Topbar({
        currentDate,
        onNavigateToday,
        onNavigatePrev,
        onNavigateNext,
        currentView,
        setCurrentView,
        sidebarOpen,
        setSidebarOpen,
        searchQuery,
        setSearchQuery,
        darkMode,
        setDarkMode
    }) {
        const handleThemeToggle = () => {
            const body = document.body;
            if (body.classList.contains('dark-theme')) {
                body.classList.remove('dark-theme');
                setDarkMode(false);
            } else {
                body.classList.add('dark-theme');
                setDarkMode(true);
            }
            window.dispatchEvent(new Event('themeChanged'));
        };

        return (
            <header className="h-16 flex items-center justify-between px-3 border-b select-none z-30 flex-shrink-0 bg-white dark:bg-[#1a1a1a] border-[#dadce0] dark:border-[#3c3c3c]">
                {/* Left section: Hamburger & Logo */}
                <div className="flex items-center gap-1.5">
                    <button
                        onClick={() => setSidebarOpen(!sidebarOpen)}
                        className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-[#2a2a2a] text-gray-600 dark:text-[#e8eaed]"
                    >
                        <i className="bi bi-list fs-5"></i>
                    </button>

                    <div className="flex items-center gap-2 ml-1">
                        {/* Google Calendar Logo Style */}
                        <div className="relative w-10 h-10 flex items-center justify-center bg-[#1a73e8] text-white rounded-lg">
                            <span className="text-[10px] font-bold uppercase absolute top-1 leading-none">
                                {dateHelpers.format(currentDate, 'MMM')}
                            </span>
                            <span className="text-base font-bold absolute bottom-0.5 leading-none">
                                {dateHelpers.format(currentDate, 'd')}
                            </span>
                        </div>
                        <span className="text-[18px] font-normal tracking-tight text-gray-800 dark:text-[#e8eaed]">
                            Calendar
                        </span>
                    </div>
                </div>

                {/* Center-Left: Navigation */}
                <div className="flex items-center gap-2 ml-4">
                    <button
                        onClick={onNavigateToday}
                        className="px-4 py-1.5 border rounded-full text-sm font-medium transition-colors text-gray-700 dark:text-[#e8eaed] border-[#dadce0] dark:border-[#3c3c3c] hover:bg-gray-50 dark:hover:bg-[#2a2a2a]"
                    >
                        Today
                    </button>

                    <div className="flex items-center ml-1">
                        <button
                            onClick={onNavigatePrev}
                            className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-[#2a2a2a] text-gray-600 dark:text-[#e8eaed]"
                        >
                            <i className="bi bi-chevron-left"></i>
                        </button>
                        <button
                            onClick={onNavigateNext}
                            className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-[#2a2a2a] text-gray-600 dark:text-[#e8eaed]"
                        >
                            <i className="bi bi-chevron-right"></i>
                        </button>
                    </div>

                    <h1 className="text-[22px] font-normal text-gray-800 dark:text-[#e8eaed] pl-2">
                        {dateHelpers.format(currentDate, 'MMMM yyyy')}
                    </h1>
                </div>

                {/* Search query box */}
                <div className="flex-1 max-w-lg mx-6">
                    <div className="relative flex items-center bg-gray-100 dark:bg-[#2a2a2a] border border-transparent rounded-lg focus-within:bg-white dark:focus-within:bg-[#1e1e1e] focus-within:border-gray-200 dark:focus-within:border-[#3c3c3c] transition-all duration-150">
                        <i className="bi bi-search text-gray-500 absolute left-3"></i>
                        <input
                            type="text"
                            placeholder="Search tasks, exams..."
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            className="w-full h-9 pl-10 pr-4 bg-transparent outline-none text-sm text-gray-800 dark:text-[#e8eaed]"
                        />
                    </div>
                </div>

                {/* Right actions */}
                <div className="flex items-center gap-1.5">
                    {/* Theme switcher */}
                    <button
                        onClick={handleThemeToggle}
                        className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-[#2a2a2a] text-gray-600 dark:text-[#e8eaed]"
                        title={darkMode ? 'Light Theme' : 'Dark Theme'}
                    >
                        {darkMode ? <i className="bi bi-sun text-yellow-500"></i> : <i className="bi bi-moon"></i>}
                    </button>

                    <button className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-[#2a2a2a] text-gray-600 dark:text-[#e8eaed]" title="Help">
                        <i className="bi bi-question-circle"></i>
                    </button>

                    <a href="/admin/settings" className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-[#2a2a2a] text-gray-600 dark:text-[#e8eaed]" title="Settings">
                        <i className="bi bi-gear"></i>
                    </a>

                    {/* View selector dropdown */}
                    <div className="relative flex items-center">
                        <select
                            value={currentView}
                            onChange={(e) => setCurrentView(e.target.value)}
                            className="bg-white dark:bg-[#1e1e1e] border border-gray-300 dark:border-[#3c3c3c] text-gray-700 dark:text-[#e8eaed] text-sm rounded-full pl-4 pr-9 py-1.5 outline-none hover:bg-gray-50 dark:hover:bg-[#2a2a2a] cursor-pointer min-w-[120px] appearance-none"
                        >
                            <option value="month">Month</option>
                            <option value="week">Week</option>
                            <option value="day">Day</option>
                        </select>
                        <i className="bi bi-chevron-down absolute right-3.5 text-xs text-gray-500 dark:text-gray-400 pointer-events-none"></i>
                    </div>

                    <button 
                        className={`p-2 rounded-full hover:bg-gray-100 dark:hover:bg-[#2a2a2a] ${currentView === 'month' ? 'text-[#1a73e8]' : 'text-gray-600 dark:text-[#e8eaed]'}`}
                        onClick={() => setCurrentView('month')}
                    >
                        <i className="bi bi-grid-3x3-gap-fill"></i>
                    </button>
                    <button className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-[#2a2a2a] text-gray-600 dark:text-[#e8eaed]">
                        <i className="bi bi-check2-circle"></i>
                    </button>
                </div>
            </header>
        );
    }

    // --- COMPONENT: SIDEBAR ---
    function Sidebar({
        currentDate,
        setCurrentDate,
        categoryFilters,
        setCategoryFilters,
        conflictCheckOpen,
        setConflictCheckOpen,
        globalConflicts,
        onCreateEventClick,
        adminName
    }) {
        const [miniMonth, setMiniMonth] = useState(dateHelpers.startOfMonth(currentDate));
        const [myCalsExpanded, setMyCalsExpanded] = useState(true);
        const [otherCalsExpanded, setOtherCalsExpanded] = useState(true);

        useEffect(() => {
            setMiniMonth(dateHelpers.startOfMonth(currentDate));
        }, [currentDate]);

        const miniCalDays = useMemo(() => {
            const monthStart = dateHelpers.startOfMonth(miniMonth);
            const monthEnd = dateHelpers.endOfMonth(monthStart);
            const startDate = dateHelpers.startOfWeek(monthStart);
            const endDate = dateHelpers.endOfWeek(monthEnd);
            return dateHelpers.eachDayOfInterval(startDate, endDate);
        }, [miniMonth]);

        const handleCategoryToggle = (key) => {
            setCategoryFilters(prev => ({
                ...prev,
                [key]: !prev[key]
            }));
        };

        return (
            <aside className="w-64 border-r flex flex-col h-full bg-white dark:bg-[#1a1a1a] border-[#dadce0] dark:border-[#3c3c3c] flex-shrink-0 select-none pb-4 overflow-y-auto">
                {/* Create Dropdown button */}
                <div className="p-4">
                    <button
                        onClick={onCreateEventClick}
                        className="flex items-center gap-3 px-6 py-3.5 bg-white dark:bg-[#303030] hover:bg-gray-100 dark:hover:bg-[#2a2a2a] text-gray-700 dark:text-[#e8eaed] rounded-full border border-[#dadce0] dark:border-[#5f6368] transition-shadow duration-150 font-medium text-sm cursor-pointer"
                    >
                        <i className="bi bi-plus-lg text-[#1a73e8] dark:text-[#e8eaed] text-lg"></i>
                        <span>Create</span>
                        <i className="bi bi-chevron-down text-xs text-gray-400"></i>
                    </button>
                </div>

                {/* Mini Calendar */}
                <div className="px-4 py-1">
                    <div className="flex items-center justify-between px-1 mb-2">
                        <span className="text-xs font-semibold text-gray-700 dark:text-[#e8eaed]">
                            {dateHelpers.format(miniMonth, 'MMMM yyyy')}
                        </span>
                        <div className="flex items-center gap-1">
                            <button
                                onClick={() => setMiniMonth(dateHelpers.subMonths(miniMonth, 1))}
                                className="p-1 rounded-full hover:bg-gray-100 dark:hover:bg-[#2a2a2a] text-gray-600 dark:text-gray-400"
                            >
                                <i className="bi bi-chevron-left text-xs"></i>
                            </button>
                            <button
                                onClick={() => setMiniMonth(dateHelpers.addMonths(miniMonth, 1))}
                                className="p-1 rounded-full hover:bg-gray-100 dark:hover:bg-[#2a2a2a] text-gray-600 dark:text-gray-400"
                            >
                                <i className="bi bi-chevron-right text-xs"></i>
                            </button>
                        </div>
                    </div>

                    {/* Day short headers */}
                    <div className="grid grid-cols-7 text-center text-[10px] font-semibold text-gray-500 dark:text-gray-400 mb-1">
                        <span>S</span>
                        <span>M</span>
                        <span>T</span>
                        <span>W</span>
                        <span>T</span>
                        <span>F</span>
                        <span>S</span>
                    </div>

                    {/* Mini grid days */}
                    <div className="grid grid-cols-7 text-center gap-y-1 text-[12px]">
                        {miniCalDays.map((day, idx) => {
                            const isCurr = dateHelpers.isSameMonth(day, miniMonth);
                            const isSelected = dateHelpers.isSameDay(day, currentDate);
                            const isToday = dateHelpers.isToday(day);

                            return (

    function MonthView({
        currentDate,
        events,
        categoryFilters,
        conflictsMap,
        onCellClick,
        onEventClick
    }) {
        const monthStart = dateHelpers.startOfMonth(currentDate);
        const monthEnd = dateHelpers.endOfMonth(monthStart);
        const startDate = dateHelpers.startOfWeek(monthStart);
        const endDate = dateHelpers.endOfWeek(monthEnd);

        const days = dateHelpers.eachDayOfInterval(startDate, endDate);

        // Filter categories
        const getFilteredEventsForDay = (day) => {
            return events.filter(e => {
                const s = new Date(e.start);
                if (!dateHelpers.isSameDay(s, day)) return false;
                const cat = getEventCategory(e);
                return categoryFilters[cat];
            }).sort((a, b) => new Date(a.start).getTime() - new Date(b.start).getTime());
        };

        const handleCellClick = (e, day) => {
            if (e.target.closest('.event-pill') || e.target.closest('.overflow-link')) return;
            onCellClick(day, { x: e.clientX, y: e.clientY });

            admin: 'bg-[#1a73e8] text-[#e8eaed]',
            exams: 'bg-[#7986cb] text-[#e8eaed]',
            tasks: 'bg-[#0b8043] dark:bg-[#0f9d58] text-white',

                {/* Headers row */}
                <div className="grid grid-cols-7 border-b border-[#dadce0] dark:border-[#3c3c3c] flex-shrink-0">
                    {weekdayNamesShort.map((day, idx) => (
                        <div key={idx} className="text-center py-2 text-[11px] font-medium text-gray-500 dark:text-[#9aa0a6] uppercase tracking-[0.8px]">

                    className="grid grid-cols-7 flex-grow border-b border-r border-[#dadce0] dark:border-[#3c3c3c]"

                        const isCurrMonth = dateHelpers.isSameMonth(day, currentDate);

                        const dayConflicts = dayEvents.filter(e => conflictsMap[e.id]?.length > 0);
                        const hasConflict = dayConflicts.length > 0;

                        // Google Calendar month display rules: show day number or "1 Jul" style

                                onClick={(e) => handleCellClick(e, day)}
                                className={`
                                    border-l border-t border-[#dadce0] dark:border-[#3c3c3c] p-1 flex flex-col min-h-0 relative hover:bg-gray-50/50 dark:hover:bg-[#2a2a2a] cursor-pointer transition-colors duration-75
                                    ${!isCurrMonth ? 'bg-gray-50/30 dark:bg-[#1b1b1c]/10 text-gray-400 dark:text-[#5f6368]' : 'bg-white dark:bg-[#1e1e1e]'}

    // --- COMPONENT: WEEKVIEW ---
    function WeekView({
        currentDate,
        events,
        categoryFilters,
        conflictsMap,
        onCellClick,
        onEventClick
    }) {
        const startOfCurrWeek = dateHelpers.startOfWeek(currentDate);
        const weekDays = dateHelpers.eachDayOfInterval(startOfCurrWeek, dateHelpers.addDays(startOfCurrWeek, 6));

        const hours = Array.from({ length: 24 }, (_, i) => i);
        const rowHeight = 60; // 60px per hour

        // Time indicator details
        const [currentTime, setCurrentTime] = useState(new Date());
        useEffect(() => {
            const timer = setInterval(() => setCurrentTime(new Date()), 60000);
            return () => clearInterval(timer);
        }, []);

        const getFilteredEventsForDay = (day) => {
            return events.filter(e => {
                const s = new Date(e.start);
                if (!dateHelpers.isSameDay(s, day)) return false;
                const cat = getEventCategory(e);
                return categoryFilters[cat];
            });
        };

        const computeEventPositions = (dayEvents) => {
            const sorted = [...dayEvents].sort((a, b) => new Date(a.start).getTime() - new Date(b.start).getTime());
            const columns = [];
            const positions = {};

            sorted.forEach(event => {
                const start = new Date(event.start);
                const end = new Date(event.end);
                
                let colIndex = 0;
                while (true) {
                    if (!columns[colIndex]) {
                        columns[colIndex] = [event];
                        break;
                    }
                    
                    const hasOverlap = columns[colIndex].some(other => {
                        const otherStart = new Date(other.start);
                        const otherEnd = new Date(other.end);
                        return start < otherEnd && otherStart < end;
                    });

                    if (!hasOverlap) {
                        columns[colIndex].push(event);
                        break;
                    }
                    colIndex++;
                }
                positions[event.id] = { colIndex };
            });

            sorted.forEach(event => {
                const start = new Date(event.start);
                const end = new Date(event.end);

                const overlapping = sorted.filter(other => {
                    const otherStart = new Date(other.start);
                    const otherEnd = new Date(other.end);
                    return start < otherEnd && otherStart < end;
                });

                let maxColIndex = 0;
                overlapping.forEach(other => {
                    const pos = positions[other.id];
                    if (pos.colIndex > maxColIndex) {
                        maxColIndex = pos.colIndex;
                    }
                });

                positions[event.id].totalCols = maxColIndex + 1;
            });

            return positions;
        };

        const handleCellClick = (e, day, hour) => {
            if (e.target.closest('.event-block')) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const clickY = e.clientY - rect.top;
            const clickMinute = Math.floor((clickY / rowHeight) * 60);

            const selectedDate = new Date(day.getFullYear(), day.getMonth(), day.getDate(), hour, clickMinute);
            onCellClick(selectedDate, { x: e.clientX, y: e.clientY });
        };

        const categoryColors = {
            admin: 'bg-[#1a73e8] border-l-4 border-blue-800 text-white',
            exams: 'bg-[#7986cb] border-l-4 border-indigo-900 text-white',
            tasks: 'bg-[#0b8043] dark:bg-[#0f9d58] border-l-4 border-green-800 text-white',
            holidays: 'bg-[#0f9d58] dark:bg-[#0d652d] border-l-4 border-green-900 text-white'
        };

        return (
            <div className="flex-1 flex flex-col h-full bg-white dark:bg-[#1a1a1a] overflow-hidden select-none text-gray-800 dark:text-[#e8eaed]">
                {/* Header Row */}
                <div className="flex border-b border-[#dadce0] dark:border-[#3c3c3c] flex-shrink-0">
                    <div className="w-16 flex-shrink-0 border-r border-[#dadce0] dark:border-[#3c3c3c]" />
                    <div className="flex-1 grid grid-cols-7">
                        {weekDays.map((day, idx) => {
                            const isToday = dateHelpers.isToday(day);
                            return (
                                <div key={idx} className="text-center py-2 border-r border-[#dadce0] dark:border-[#3c3c3c] flex flex-col items-center">
                                    <span className="text-[11px] font-semibold text-gray-500 dark:text-[#9aa0a6] uppercase tracking-[0.8px]">
                                        {dateHelpers.format(day, 'EEE')}
                                    </span>
                                    <span 
                                        className={`
                                            text-base font-semibold h-8 w-8 flex items-center justify-center rounded-full mt-0.5
                                            ${isToday ? 'bg-[#1a73e8] text-white font-bold' : 'text-gray-700 dark:text-[#e8eaed]'}
                                        `}
                                    >
                                        {day.getDate()}
                                    </span>
                                </div>
                            );
                        })}
                    </div>
                </div>

                {/* Hourly scroll panel */}
                <div className="flex-grow overflow-y-auto flex relative">
                    {/* Time Label Column */}
                    <div className="w-16 flex-shrink-0 border-r border-[#dadce0] dark:border-[#3c3c3c] bg-gray-50/20 dark:bg-transparent">
                        {hours.map(hour => (
                            <div key={hour} className="relative text-right pr-2 text-[10px] font-medium text-gray-500 dark:text-gray-400" style={{ height: `${rowHeight}px` }}>
                                {hour > 0 && (
                                    <span className="absolute -top-2 right-2">
                                        {hour > 12 ? `${hour - 12} PM` : hour === 12 ? '12 PM' : `${hour} AM`}
                                    </span>
                                )}
                            </div>
                        ))}
                    </div>

                    {/* Columns grid */}
                    <div className="flex-1 grid grid-cols-7 relative h-fit">
                        {weekDays.map((day, dayIdx) => {
                            const dayEvents = getFilteredEventsForDay(day);
                            const positions = computeEventPositions(dayEvents);
                            const isTodayColumn = dateHelpers.isToday(day);

                            // Calculate Red Time Marker Position
                            const currentHour = currentTime.getHours();
                            const currentMin = currentTime.getMinutes();
                            const timeIndicatorTop = (currentHour * rowHeight) + ((currentMin / 60) * rowHeight);

                            return (
                                <div key={dayIdx} className="relative border-r border-[#dadce0] dark:border-[#3c3c3c]" style={{ height: `${rowHeight * 24}px` }}>
                                    {hours.map(hour => (
                                        <div
                                            key={hour}
                                            onClick={(e) => handleCellClick(e, day, hour)}
                                            className="border-b border-gray-100 dark:border-[#3c3c3c]/50 w-full hover:bg-gray-50/40 dark:hover:bg-[#2a2a2a]/20 cursor-pointer"
                                            style={{ height: `${rowHeight}px` }}
                                        />
                                    ))}

                                    {/* Red current time indicator line */}
                                    {isTodayColumn && (
                                        <div 
                                            className="absolute left-0 right-0 border-t-2 border-red-500 z-10 pointer-events-none"
                                            style={{ top: `${timeIndicatorTop}px` }}
                                        >
                                            <div className="w-2.5 h-2.5 rounded-full bg-red-500 absolute -left-1.5 -top-1" />
                                        </div>
                                    )}

                                    {/* Absolutely Positioned Event Blocks */}
                                    {dayEvents.map(event => {
                                        const start = new Date(event.start);
                                        const end = new Date(event.end);
                                        
                                        const startHour = start.getHours();
                                        const startMin = start.getMinutes();
                                        const durationMins = dateHelpers.differenceInMinutes(end, start);
                                        
                                        const top = (startHour * rowHeight) + ((startMin / 60) * rowHeight);
                                        const height = Math.max((durationMins / 60) * rowHeight, 20);

                                        const cat = getEventCategory(event);
                                        const colorStyle = categoryColors[cat] || 'bg-gray-500 border-l-4 border-gray-800 text-white';

                                        const pos = positions[event.id] || { colIndex: 0, totalCols: 1 };
                                        const width = 100 / pos.totalCols;
                                        const left = pos.colIndex * width;

                                        const conflicts = conflictsMap[event.id] || [];
                                        const hasConflict = conflicts.length > 0;

                                        return (
                                            <div
                                                key={event.id}
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    onEventClick(event, { x: e.clientX, y: e.clientY });
                                                }}
                                                className={`
                                                    event-block absolute p-1.5 rounded-[4px] text-[11px] font-medium leading-tight flex flex-col justify-between overflow-hidden cursor-pointer select-none transition-all duration-100 hover:scale-[1.01] hover:z-20
                                                    ${colorStyle}
                                                `}
                                                style={{
                                                    top: `${top}px`,
                                                    height: `${height}px`,
                                                    left: `${left}%`,
                                                    width: `${width - 0.5}%`,
                                                }}
                                            >
                                                <div className="truncate">
                                                    <div className="flex items-center gap-1 select-none">
                                                        <span className="opacity-80 text-[10px]">
                                                            {dateHelpers.format(start, 'HH:mm')}
                                                        </span>
                                                        {hasConflict && (
                                                            <span className="w-1.5 h-1.5 rounded-full bg-red-600 inline-block" />
                                                        )}
                                                    </div>
                                                    <div className="truncate font-sans font-semibold mt-0.5">{event.title}</div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            );
                        })}
                    </div>
                </div>
            </div>
        );
    }

                let colIndex = 0;
                while (true) {
                    if (!columns[colIndex]) {
                        columns[colIndex] = [event];
                        break;
                    }
                    
                    const hasOverlap = columns[colIndex].some(other => {
                        const otherStart = new Date(other.start);
                        const otherEnd = new Date(other.end);
                        return start < otherEnd && otherStart < end;
                    });

                    if (!hasOverlap) {
                        columns[colIndex].push(event);
                        break;
                    }
                    colIndex++;
                }
                positions[event.id] = { colIndex };
            });

            sorted.forEach(event => {
                const start = new Date(event.start);
                const end = new Date(event.end);

                const overlapping = sorted.filter(other => {
                    const otherStart = new Date(other.start);
                    const otherEnd = new Date(other.end);
                    return start < otherEnd && otherStart < end;
                });

                let maxColIndex = 0;
                overlapping.forEach(other => {
                    const pos = positions[other.id];
                    if (pos.colIndex > maxColIndex) {
                        maxColIndex = pos.colIndex;
                    }
                });

                positions[event.id].totalCols = maxColIndex + 1;
            });

            return positions;
        };

        const handleCellClick = (e, hour) => {
            if (e.target.closest('.event-block')) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const clickY = e.clientY - rect.top;
            const clickMinute = Math.floor((clickY / rowHeight) * 60);

            const selectedDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate(), hour, clickMinute);
            onCellClick(selectedDate, { x: e.clientX, y: e.clientY });
        };

        const categoryColors = {
            admin: 'bg-[#1a73e8] border-l-4 border-blue-800 text-white',
            exams: 'bg-[#7986cb] border-l-4 border-indigo-900 text-white',
            tasks: 'bg-[#0b8043] dark:bg-[#0f9d58] border-l-4 border-green-800 text-white',
            holidays: 'bg-[#0f9d58] dark:bg-[#0d652d] border-l-4 border-green-900 text-white'
        };

        const dayEvents = getFilteredEventsForDay();
        const positions = computeEventPositions(dayEvents);
        const isToday = dateHelpers.isToday(currentDate);

        // Time Indicator Top position
        const currentHour = currentTime.getHours();
        const currentMin = currentTime.getMinutes();
        const timeIndicatorTop = (currentHour * rowHeight) + ((currentMin / 60) * rowHeight);

        return (
            <div className="flex-1 flex flex-col h-full bg-white dark:bg-[#1a1a1a] overflow-hidden select-none text-gray-800 dark:text-[#e8eaed]">
                {/* Header Row */}
                <div className="flex border-b border-[#dadce0] dark:border-[#3c3c3c] flex-shrink-0">
                    <div className="w-16 flex-shrink-0 border-r border-[#dadce0] dark:border-[#3c3c3c]" />
                    <div className="flex-1 py-3 px-6 flex items-center gap-4">
                        <div className="flex flex-col items-center">
                            <span className="text-[11px] font-semibold text-gray-500 dark:text-[#9aa0a6] uppercase tracking-[0.8px]">
                                {dateHelpers.format(currentDate, 'EEEE')}
                            </span>
                            <span 
                                className={`
                                    text-2xl font-bold h-12 w-12 flex items-center justify-center rounded-full mt-1
                                    ${isToday ? 'bg-[#1a73e8] text-white' : 'text-gray-800 dark:text-[#e8eaed]'}
                                `}
                            >
                                {currentDate.getDate()}
                            </span>
                        </div>
                    </div>
                </div>

                {/* Hourly content panel */}
                <div className="flex-grow overflow-y-auto flex relative">
                    {/* Time labels column */}
                    <div className="w-16 flex-shrink-0 border-r border-[#dadce0] dark:border-[#3c3c3c] bg-gray-50/20 dark:bg-transparent">
                        {hours.map(hour => (
                            <div key={hour} className="relative text-right pr-2 text-[10px] font-medium text-gray-500 dark:text-gray-400" style={{ height: `${rowHeight}px` }}>
                                {hour > 0 && (
                                    <span className="absolute -top-2 right-2">
                                        {hour > 12 ? `${hour - 12} PM` : hour === 12 ? '12 PM' : `${hour} AM`}
                                    </span>
                                )}
                            </div>
                        ))}
                    </div>

                    {/* Single Day grid area */}
                    <div className="flex-1 relative h-fit">
                        {hours.map(hour => (
                            <div
                                key={hour}
                                onClick={(e) => handleCellClick(e, hour)}
                                className="border-b border-gray-100 dark:border-[#3c3c3c]/50 w-full hover:bg-gray-50/40 dark:hover:bg-[#2a2a2a]/20 cursor-pointer"
                                style={{ height: `${rowHeight}px` }}
                            />
                        ))}

                        {/* Red Current Time Line Indicator */}
                        {isToday && (
                            <div 
                                className="absolute left-0 right-0 border-t-2 border-red-500 z-10 pointer-events-none"
                                style={{ top: `${timeIndicatorTop}px` }}
                            >
                                <div className="w-2.5 h-2.5 rounded-full bg-red-500 absolute -left-1.5 -top-1" />
                            </div>
                        )}

                        {/* Events Blocks */}
                        {dayEvents.map(event => {
                            const start = new Date(event.start);
                            const end = new Date(event.end);
                            
                            const startHour = start.getHours();
                            const startMin = start.getMinutes();
                            const durationMins = dateHelpers.differenceInMinutes(end, start);
                            
                            const top = (startHour * rowHeight) + ((startMin / 60) * rowHeight);
                            const height = Math.max((durationMins / 60) * rowHeight, 20);

                            const cat = event.category?.toLowerCase() || (event.eventType?.toLowerCase() === 'holiday' ? 'holidays' : (event.eventType?.toLowerCase() === 'exam' ? 'exams' : 'admin'));
                            const colorStyle = categoryColors[cat] || 'bg-gray-500 border-l-4 border-gray-800 text-white';

                            const pos = positions[event.id] || { colIndex: 0, totalCols: 1 };
                            const width = 100 / pos.totalCols;
                            const left = pos.colIndex * width;

                            const conflicts = conflictsMap[event.id] || [];
                            const hasConflict = conflicts.length > 0;

                            return (
                                <div
                                    key={event.id}
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        onEventClick(event, { x: e.clientX, y: e.clientY });
                                    }}
                                    className={`
                                        event-block absolute p-2 rounded-[4px] text-xs font-semibold leading-tight flex flex-col justify-between overflow-hidden cursor-pointer select-none transition-all duration-100 hover:scale-[1.01] hover:z-20
                                        ${colorStyle}
                                    `}
                                    style={{
                                        top: `${top}px`,
                                        height: `${height}px`,
                                        left: `${left}%`,
                                        width: `${width - 0.5}%`,
                                    }}
                                >
                                    <div>
                                        <div className="flex items-center justify-between">
                                            <span className="opacity-80 text-[10px]">
                                                {dateHelpers.format(start, 'hh:mm a')} - {dateHelpers.format(end, 'hh:mm a')}
                                            </span>
                                            {hasConflict && (
                                                <i className="bi bi-exclamation-triangle-fill text-red-400 text-xs"></i>
                                            )}
                                        </div>
                                        <div className="truncate font-semibold text-sm mt-0.5">{event.title}</div>
                                    </div>
                                    
                                    {height > 60 && (
                                        <div className="mt-1 space-y-0.5 text-[10px] font-normal opacity-85">
                                            {event.room && <div>Room: {event.room}</div>}
                                            {event.description && <div className="truncate italic">"{event.description}"</div>}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            </div>
        );
    }

        if (!isOpen) return null;

        const handleSubmit = (e) => {

                        {/* Notes / Description */}

            tasks: '#0b8043',

                            </button>
                        )}
                        <button onClick={onClose} className="p-1.5 rounded-full hover:bg-gray-200 dark:hover:bg-[#3c3c3c] text-gray-450 dark:text-gray-400">
                            <i className="bi bi-x-lg text-xs"></i>
                        </button>
                    </div>
                </div>

                {/* Details body */}
                <div className="p-4 space-y-3">
                    <h3 className="text-base font-bold text-gray-900 dark:text-white leading-snug">{event.title}</h3>

                    <div className="flex items-start gap-2.5 text-xs text-gray-600 dark:text-gray-300">
                        <i className="bi bi-clock text-gray-500 mt-0.5"></i>
                        <div>
                            <div className="font-semibold">{dateHelpers.format(start, 'EEEE, MMMM d, yyyy')}</div>
                            <div className="text-gray-550 dark:text-gray-400 mt-0.5">{dateHelpers.format(start, 'hh:mm a')} - {dateHelpers.format(end, 'hh:mm a')}</div>
                        </div>
                    </div>

                    {/* Room details */}
                    {event.room && (
                        <div className="flex items-start gap-2.5 text-xs text-gray-600 dark:text-gray-300">
                            <i className="bi bi-geo-alt-fill text-gray-500 mt-0.5"></i>
                            <div>
                                <span className="font-semibold">Room: </span>
                                <span className="text-gray-550 dark:text-gray-400">{event.room}</span>
                            </div>
                        </div>
                    )}

                    {/* Status Badge */}
                    <div className="flex gap-2 items-center text-xs">
                        <span className="text-gray-550 dark:text-gray-400">Status:</span>
                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${event.status === 'Completed' ? 'bg-green-50 dark:bg-green-950/40 text-green-700 dark:text-green-400 border border-green-200 dark:border-green-900/40' : 'bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-400 border border-amber-200 dark:border-amber-900/40'}`}>
                            {event.status}
                        </span>
                    </div>

                    {/* Notes details */}
                    {event.description && (
                        <div className="flex items-start gap-2.5 text-xs text-gray-600 dark:text-gray-300 border-t border-gray-200 dark:border-[#3c3c3c] pt-2.5">
                            <i className="bi bi-list-stars text-gray-500 mt-0.5"></i>
                            <div className="italic text-gray-550 dark:text-gray-400 whitespace-pre-wrap select-text">
                                "{cleanDescription(event.description)}"
                            </div>
                        </div>
                    )}

                    {/* Task toggle complete btn */}
                    {event.eventType === 'TASK' && (
                        <div className="pt-2 border-t border-gray-200 dark:border-[#3c3c3c]">
                            <button
                                onClick={() => {
                                    onToggleComplete(event.id);
                                    onClose();
                                }}
                                className={`w-full py-1.5 rounded font-bold text-xs cursor-pointer transition-colors ${event.status === 'Completed' ? 'bg-gray-100 dark:bg-[#3c3c3c] text-gray-750 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-[#4c4c4c]' : 'bg-[#1a73e8] text-white hover:bg-blue-600'}`}
                            >
                                {event.status === 'Completed' ? '✓ Completed (Mark Pending)' : 'Mark Completed'}
                            </button>
                        </div>
                    )}

                    {/* Conflicts warnings */}
                    {conflicts.length > 0 && (
                        <div className="border-t border-red-200 dark:border-red-900/40 pt-2.5">
                            <div className="flex items-center gap-2 text-red-650 dark:text-red-400 text-xs font-bold mb-1.5">
                                <i className="bi bi-exclamation-octagon-fill"></i>
                                <span>Schedule Overlaps ({conflicts.length})</span>
                            </div>
                            <ul className="text-[10px] list-disc list-inside text-red-650 dark:text-red-400 bg-red-50 dark:bg-red-950/20 p-2 rounded border border-red-200 dark:border-red-900/20 space-y-1">
                                {conflicts.map((c, idx) => (
                                    <li key={idx} className="leading-normal">{c.message}</li>
                                ))}
                            </ul>
                        </div>
                    )}
                </div>
            </div>
        );
    }

    // --- COMPONENT: CONFLICTPANEL ---
    function ConflictPanel({
        isOpen,
        onClose,
        globalConflicts,
        onNavigateToDate
    }) {
        if (!isOpen) return null;

        return (
            <aside className="w-72 border-l flex flex-col bg-white dark:bg-[#1a1a1a] border-[#dadce0] dark:border-[#3c3c3c] h-full flex-shrink-0 select-none animate-in slide-in-from-right duration-150 z-20">
                <div className="p-4 border-b border-[#dadce0] dark:border-[#3c3c3c] flex items-center justify-between bg-gray-50/50 dark:bg-[#202124]/50">
                    <span className="font-bold text-gray-800 dark:text-[#e8eaed] text-xs uppercase tracking-wider">
                        Conflict Auditor
                    </span>
                    <button onClick={onClose} className="text-gray-450 hover:text-gray-855 dark:hover:text-white"><i className="bi bi-x-lg text-xs"></i></button>
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                    {globalConflicts.length === 0 ? (
                        <div className="text-center text-gray-400 dark:text-gray-600 py-12 px-2">
                            <i className="bi bi-calendar-check text-3xl opacity-40 mb-2 block"></i>
                            <p className="text-xs font-bold">No active conflicts detected!</p>
                            <p className="text-[10px] mt-1">Schedules are verified, room double-bookings and exams separations are clean.</p>
                        </div>
                    ) : (
                        globalConflicts.map(conf => (
                            <div
                                key={conf.id}
                                onClick={() => onNavigateToDate(new Date(conf.date))}
                                className="p-3 bg-red-50/20 dark:bg-red-950/10 border border-red-200/50 dark:border-red-900/20 rounded-lg hover:bg-red-50/40 dark:hover:bg-red-950/20 cursor-pointer transition-colors"
                            >
                                <span className="text-[9px] font-bold text-red-500 uppercase tracking-widest block mb-1">
                                    {conf.type === 'room-booking' ? 'Room Clash' : (conf.type === 'exam-buffer' ? 'Exam Buffer' : 'Time Overlap')}
                                </span>
                                <p className="text-xs font-bold text-gray-900 dark:text-gray-100 select-text leading-tight mb-2">
                                    {conf.description}
                                </p>
                                <div className="flex justify-between items-center text-[10px] text-gray-500 dark:text-gray-400">
                                    <span>{dateHelpers.format(new Date(conf.date), 'MMM d, yyyy')}</span>
                                    <span className="text-[#1a73e8] font-bold">Go To Date →</span>
                                </div>
                            </div>
                        ))
                    )}
                </div>
            </aside>
        );
    }

    // --- MAIN REACT CONTAINER (App) ---
    function App() {
        const adminName = window.loggedInAdminName || 'Super Admin';
        const allAdmins = window.allAdminsList || [];

        const [currentDate, setCurrentDate] = useState(new Date());
        const [currentView, setCurrentView] = useState('month');
        const [events, setEvents] = useState([]);
        const [categoryFilters, setCategoryFilters] = useState({
            admin: true,
            exams: true,
            tasks: true,
            holidays: true,
            birthdays: true
        });
        const [searchQuery, setSearchQuery] = useState('');

        const [sidebarOpen, setSidebarOpen] = useState(true);
        const [conflictCheckOpen, setConflictCheckOpen] = useState(false);
        const [darkMode, setDarkMode] = useState(document.body.classList.contains('dark-theme'));

        // Synchronize dark-theme status with Tailwind's class-based mode
        useEffect(() => {
            if (darkMode) {
                document.documentElement.classList.add('dark');
                document.body.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
                document.body.classList.remove('dark');
            }
        }, [darkMode]);

        // Modals state
        const [modalOpen, setModalOpen] = useState(false);
        const [modalMode, setModalMode] = useState('quick');
        const [selectedCellDate, setSelectedCellDate] = useState(null);
        const [editEvent, setEditEvent] = useState(null);
        const [popoverCoords, setPopoverCoords] = useState(null);

        // Details Popover state
        const [detailOpen, setDetailOpen] = useState(false);
        const [detailEvent, setDetailEvent] = useState(null);
        const [detailCoords, setDetailCoords] = useState(null);

        // Fetch events from Spring Boot REST API
        const loadAllEvents = useCallback(() => {
            fetch('/admin/calendar/events')
                .then(res => res.json())
                .then(data => {
                    // Map backend data model to React Calendar model
                    const mapped = data.map(e => {
                        const roomVal = parseRoomFromDescription(e.description);
                        return {
                            id: e.id,
                            title: e.title,
                            description: e.description,
                            category: e.category,
                            eventType: e.eventType,
                            priority: e.priority,
                            status: e.status,
                            createdBy: e.createdBy,
                            assignedTo: e.assignedTo,
                            visibility: e.visibility,
                            start: e.startDatetime,
                            end: e.endDatetime,
                            room: roomVal
                        };
                    });
                    setEvents(mapped);
                })
                .catch(err => console.error("Failed to load events", err));
        }, []);

        useEffect(() => {
            loadAllEvents();
            // Sync with backend theme class on window listener
            const handleTheme = () => {
                setDarkMode(document.body.classList.contains('dark-theme'));
            };
            window.addEventListener('themeChanged', handleTheme);
            return () => window.removeEventListener('themeChanged', handleTheme);
        }, [loadAllEvents]);

        // Conflicts Audits
        const { conflictsMap, globalConflicts } = useMemo(() => {
            return detectConflicts(events);
        }, [events]);

        // Filters applied to Grid render only
        const filteredEvents = useMemo(() => {
            return events.filter(e => {
                // Exclude birthday events as per user's strict request
                const isBday = e.title?.toLowerCase().includes('birthday') || e.category?.toLowerCase().includes('birthday');
                if (isBday) return false;

                if (searchQuery.trim()) {
                    const q = searchQuery.toLowerCase();
                    const match = e.title?.toLowerCase().includes(q) || e.description?.toLowerCase().includes(q) || e.room?.toLowerCase().includes(q);
                    if (!match) return false;
                }
                return true;
            });
        }, [events, searchQuery]);

        // Save event handler
        const handleSaveEvent = (data) => {
            const formData = new FormData();
            
            // Format title
            let finalTitle = data.title;
            let finalDesc = data.description;
            if (data.room) {
                finalDesc = `${finalDesc}\n[Room: ${data.room}]`;
            }

            formData.append('title', finalTitle);
            formData.append('description', finalDesc);
            formData.append('category', data.category);
            formData.append('eventType', data.eventType);
            formData.append('priority', data.priority);
            
            // Determine visibility dynamically based on assignment
            let finalVisibility = 'PRIVATE';
            if (data.assignedTo === 'Everyone' || data.eventType === 'HOLIDAY' || data.eventType === 'EXAM') {
                finalVisibility = 'SHARED';
            }
            formData.append('visibility', finalVisibility);
            
            formData.append('assignedTo', data.assignedTo);
            formData.append('date', data.dateStr);
            formData.append('startTime', data.startTime);
            formData.append('endTime', data.endTime);

            const performAdd = () => {
                fetch('/admin/calendar/event/add', {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(response => {
                    if (response.status === 'success') {
                        loadAllEvents();
                    } else {
                        alert('Error saving event: ' + response.message);
                    }
                })
                .catch(err => console.error(err));
            };

            // If editing an existing event: delete old one first, then add updated one
            if (data.id) {
                const params = new URLSearchParams();
                params.append('id', data.id);

                fetch('/admin/calendar/event/delete', {
                    method: 'POST',
                    body: params
                })
                .then(res => res.json())
                .then(response => {
                    if (response.status === 'success') {
                        performAdd();
                    } else {
                        alert('Could not update event: ' + response.message);
                    }
                })
                .catch(err => console.error(err));
            } else {
                performAdd();
            }
        };

        // Delete event handler
        const handleDeleteEvent = (id) => {
            const params = new URLSearchParams();
            params.append('id', id);

            fetch('/admin/calendar/event/delete', {
                method: 'POST',
                body: params
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    loadAllEvents();
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(err => console.error(err));
        };

        // Toggle task completion
        const handleToggleComplete = (id) => {
            const params = new URLSearchParams();
            params.append('id', id);

            fetch('/admin/calendar/event/toggle-complete', {
                method: 'POST',
                body: params
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    loadAllEvents();
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(err => console.error(err));
        };

        // Navigation controls
        const handleNavigateToday = () => setCurrentDate(new Date());
        const handleNavigatePrev = () => {
            if (currentView === 'month') setCurrentDate(prev => dateHelpers.subMonths(prev, 1));
            else if (currentView === 'week') setCurrentDate(prev => dateHelpers.subWeeks(prev, 1));
            else setCurrentDate(prev => dateHelpers.subDays(prev, 1));
        };
        const handleNavigateNext = () => {
            if (currentView === 'month') setCurrentDate(prev => dateHelpers.addMonths(prev, 1));
            else if (currentView === 'week') setCurrentDate(prev => dateHelpers.addWeeks(prev, 1));
            else setCurrentDate(prev => dateHelpers.addDays(prev, 1));
        };

        const handleCellClick = (date, coords) => {
            setDetailOpen(false);
            setEditEvent(null);
            setSelectedCellDate(date);
            setPopoverCoords(coords);
            setModalMode('quick');
            setModalOpen(true);
        };

        const handleEventClick = (event, coords) => {
            setModalOpen(false);
            setDetailEvent(event);
            setDetailCoords(coords);
            setDetailOpen(true);
        };

        const handleEditClickFromDetail = (event) => {
            setEditEvent(event);
            setModalMode('full');
            setModalOpen(true);
        };

        const handleCreateButtonClick = () => {
            setDetailOpen(false);
            setEditEvent(null);
            setSelectedCellDate(new Date(currentDate));
            setPopoverCoords(null);
            setModalMode('full');
            setModalOpen(true);
        };

        const handleConflictNavigate = (date) => {
            setCurrentDate(date);
            setCurrentView('day');
        };

        return (
            <div className="flex flex-col h-full w-full bg-white dark:bg-[#1a1a1a] text-gray-800 dark:text-[#e8eaed] overflow-hidden">
                <Topbar
                    currentDate={currentDate}
                    onNavigateToday={handleNavigateToday}
                    onNavigatePrev={handleNavigatePrev}
                    onNavigateNext={handleNavigateNext}
                    currentView={currentView}
                    setCurrentView={setCurrentView}
                    sidebarOpen={sidebarOpen}
                    setSidebarOpen={setSidebarOpen}
                    searchQuery={searchQuery}
                    setSearchQuery={setSearchQuery}
                    darkMode={darkMode}
                    setDarkMode={setDarkMode}
                />

                <div className="flex flex-1 overflow-hidden relative">
                    {sidebarOpen && (
                        <Sidebar
                            currentDate={currentDate}
                            setCurrentDate={setCurrentDate}
                            categoryFilters={categoryFilters}
                            setCategoryFilters={setCategoryFilters}
                            conflictCheckOpen={conflictCheckOpen}
                            setConflictCheckOpen={setConflictCheckOpen}
                            globalConflicts={globalConflicts}
                            onCreateEventClick={handleCreateButtonClick}
                            adminName={adminName}
                        />
                    )}

                    <main className="flex-grow-1 flex flex-col min-w-0 h-full relative overflow-hidden bg-white dark:bg-[#1e1e1e]">
                        {currentView === 'month' && (
                            <MonthView
                                currentDate={currentDate}
                                events={filteredEvents}
                                categoryFilters={categoryFilters}
                                conflictsMap={conflictsMap}
                                onCellClick={handleCellClick}
                                onEventClick={handleEventClick}
                            />
                        )}
                        {currentView === 'week' && (
                            <WeekView
                                currentDate={currentDate}
                                events={filteredEvents}
                                categoryFilters={categoryFilters}
                                conflictsMap={conflictsMap}
                                onCellClick={handleCellClick}
                                onEventClick={handleEventClick}
                            />
                        )}
                        {currentView === 'day' && (
                            <DayView
                                currentDate={currentDate}
                                events={filteredEvents}
                                categoryFilters={categoryFilters}
                                conflictsMap={conflictsMap}
                                onCellClick={handleCellClick}
                                onEventClick={handleEventClick}
                            />
                        )}
                    </main>

                    <ConflictPanel
                        isOpen={conflictCheckOpen}
                        onClose={() => setConflictCheckOpen(false)}
                        globalConflicts={globalConflicts}
                        onNavigateToDate={handleConflictNavigate}
                    />

                    <CreateEventModal
                        isOpen={modalOpen}
                        onClose={() => setModalOpen(false)}
                        onSave={handleSaveEvent}
                        selectedDate={selectedCellDate}
                        editEvent={editEvent}
                        popoverCoords={popoverCoords}
                        mode={modalMode}
                        setMode={setModalMode}
                        allAdmins={allAdmins}
                    />

                    <EventDetailPopover
                        isOpen={detailOpen}
                        event={detailEvent}
                        coords={detailCoords}
                        onClose={() => setDetailOpen(false)}
                        onEditClick={handleEditClickFromDetail}
                        onDeleteClick={handleDeleteEvent}
                        onToggleComplete={handleToggleComplete}
                        conflicts={detailEvent ? conflictsMap[detailEvent.id] : []}
                        adminName={adminName}
                    />
                </div>
            </div>
        );
    }

    // --- Mount application ---
    const rootEl = document.getElementById('react-calendar-root');
    if (rootEl) {
        const root = ReactDOM.createRoot(rootEl);
        root.render(<App />);
    }
/*]]>*/
</script>
</body>
</html>
