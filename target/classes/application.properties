spring.application.name=exam
spring.thymeleaf.cache=false  
# Database Connection (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/exam_db
spring.datasource.username=postgres
spring.datasource.password=1812
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=${PORT:8081}
app.upload.dir=${APP_UPLOAD_DIR:C:/uploads/}

# File Upload Configuration 
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Session Configuration (Cookie-only tracking to prevent ;jsessionid URLs)
server.servlet.session.tracking-modes=cookie